<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Secretyshka | Motion & Video Production</title>
    
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        html { background-color: #050505; height: 100%; }

        body { 
            margin: 0; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; min-height: 100vh;
            padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
            background: linear-gradient(125deg, #050505, #0a1128, #1c0b2e, #050505);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        .noise { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; opacity: 0.05; pointer-events: none; 
            background-image: url('https://grainy-gradients.vercel.app/noise.svg'); 
        }

        nav, header, main, footer { position: relative; z-index: 10; }

        /* Карточки видео без текста */
        .video-card {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 2rem;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .video-card img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(1) brightness(0.4);
            transition: all 0.6s ease;
        }

        .video-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .video-card:hover img {
            filter: grayscale(0) brightness(1);
        }

        .play-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: all 0.4s ease;
            z-index: 2;
        }

        .video-card:hover .play-icon { opacity: 1; }

        /* Модальное окно с Glow-эффектом */
        #video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.4s ease;
        }

        #video-modal.active { display: flex; opacity: 1; }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .modal-content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 1000px;
        }

        /* Тот самый "светящийся" фон за видео */
        .modal-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 105%; height: 105%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(139, 92, 246, 0.1) 50%, transparent 70%);
            filter: blur(40px);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #video-modal.active .modal-glow { opacity: 1; }

        .modal-content {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #video-modal.active .modal-content { transform: scale(1); }

        .modal-content-wrapper.vertical { max-width: 400px; }
        .modal-content-wrapper.vertical .modal-content { aspect-ratio: 9/16; }

        .close-modal {
            position: absolute; top: -50px; right: 0;
            color: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s;
            font-size: 24px;
        }
        .close-modal:hover { color: #fff; }

        /* Навигация */
        #navbar {
            position: fixed; top: calc(24px + var(--safe-top)); left: 50%;
            transform: translateX(-50%); width: 95%; max-width: 1400px;
            z-index: 100; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
            padding: 16px 28px; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; align-items: center;
        }
        #navbar.scrolled { top: calc(12px + var(--safe-top)); width: 90%; padding: 10px 24px; background: rgba(5, 5, 5, 0.65); }
        #navbar img { height: 32px; display: block; }

        .blur-target { cursor: default; }
        .blur-word { 
            display: inline-block; white-space: pre; filter: blur(12px); 
            opacity: 0; transform: translateY(15px); 
            transition: filter 0.8s ease-out, opacity 0.8s ease-out, transform 0.8s ease-out; 
        }
        .blur-word.visible { filter: blur(0px); opacity: 1; transform: translateY(0); }
        .text-outline .blur-word { -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2); color: transparent; }

        .btn-leifu { background: #fff; color: #000; transition: all 0.4s ease; }
        .btn-leifu:hover { background: #3b82f6; color: #fff; transform: translateY(-3px); }

        #backToTop { position: fixed; bottom: calc(30px + var(--safe-bottom)); right: 30px; width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; z-index: 99; opacity: 0; visibility: hidden; transition: 0.4s; }
        #backToTop.show { opacity: 1; visibility: visible; }
        
        #lang-slider { will-change: transform; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .lang-active-text { color: #000 !important; }
        .email-pill { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 24px; border-radius: 100px; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.4s ease; margin-bottom: 2rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="noise"></div>

    <div id="video-modal">
        <div class="modal-overlay" onclick="closeVideo()"></div>
        <div class="modal-content-wrapper" id="modal-wrapper">
            <div class="modal-glow"></div>
            <div class="close-modal" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></div>
            <div class="modal-content">
                <iframe id="video-player" width="100%" height="100%" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <a href="#" id="backToTop"><i class="fa-solid fa-arrow-up"></i></a>

    <nav id="navbar">
        <div class="flex justify-between items-center w-full">
            <a href="#" class="shrink-0"><img src="./logo small.png" alt="Logo"></a>
            <div class="hidden lg:flex items-center bg-white/5 border border-white/10 px-1 py-1 rounded-full backdrop-blur-sm">
                <a href="#horizontal" class="px-5 py-2 text-[10px] font-black uppercase tracking-[0.2em]" data-i18n="nav-horizontal">Horizontal</a>
                <div class="w-[1px] h-3 bg-white/10"></div>
                <a href="#vertical" class="px-5 py-2 text-[10px] font-black uppercase tracking-[0.2em]" data-i18n="nav-vertical">Vertical</a>
            </div>
            <div class="flex items-center gap-4 md:gap-6">
                <a href="#contact" class="hidden sm:block text-[10px] font-black uppercase tracking-[0.2em]" data-i18n="btn-contact-nav">Contact</a>
                <div class="relative flex bg-white/5 p-1 rounded-xl border border-white/10 w-[80px] md:w-[90px] h-[32px] md:h-[36px] overflow-hidden">
                    <div id="lang-slider" class="absolute top-1 left-1 bottom-1 w-[36px] md:w-[42px] bg-white rounded-lg z-0"></div>
                    <button onclick="changeLang('en')" class="relative z-10 w-1/2 text-[9px] md:text-[10px] font-black transition-colors duration-300" id="txt-en">EN</button>
                    <button onclick="changeLang('ru')" class="relative z-10 w-1/2 text-[9px] md:text-[10px] font-black transition-colors duration-300" id="txt-ru">RU</button>
                </div>
            </div>
        </div>
    </nav>

    <header class="min-h-screen flex flex-col items-center justify-center relative px-6 text-center pt-20">
        <div class="z-10 w-full max-w-5xl">
            <h1 class="text-[12vw] md:text-[110px] font-black mb-6 md:mb-8 tracking-tighter uppercase leading-[0.9] italic">
                <span class="block blur-target" data-i18n="hero-title-1">Video editing</span>
                <span class="text-outline block blur-target" data-i18n="hero-title-2">For your brand</span>
            </h1>
            <p class="text-gray-500 text-base md:text-xl max-w-xl mx-auto mb-10 md:mb-12 font-medium px-4 blur-target" data-i18n="hero-desc">High-end vertical content and cinematic motion design.</p>
            <div class="flex flex-col sm:flex-row justify-center gap-4" data-aos="fade-up">
                <a href="#horizontal" class="btn-leifu px-10 py-5 rounded-full font-black uppercase tracking-widest text-[10px] md:text-xs" data-i18n="btn-work">View Projects</a>
                <a href="#contact" class="px-10 py-5 rounded-full font-black uppercase tracking-widest text-[10px] md:text-xs border border-white/20 hover:border-white transition-all" data-i18n="btn-contact-main">Contact Me</a>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-6 py-20 md:py-32">
        <section id="horizontal" class="mb-32">
            <div class="flex justify-between items-end mb-12 border-b border-white/10 pb-8">
                <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter blur-target" data-i18n="sec-horizontal">Horizontal</h2>
                <span class="text-gray-600 font-bold uppercase tracking-widest text-[10px] italic">01</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div data-aos="fade-up" class="video-card aspect-video group" onclick="openVideo('YOUTUBE_ID_1', 'horizontal')">
                    <img src="./hor1.png" alt="Project">
                    <div class="play-icon"><i class="fa-solid fa-play text-white"></i></div>
                </div>
                <div data-aos="fade-up" data-aos-delay="200" class="video-card aspect-video group" onclick="openVideo('YOUTUBE_ID_2', 'horizontal')">
                    <img src="./hor2.png" alt="Project">
                    <div class="play-icon"><i class="fa-solid fa-play text-white"></i></div>
                </div>
            </div>
        </section>

        <section id="vertical" class="mb-32 flex flex-col items-center">
            <div class="w-full flex justify-between items-end mb-12 border-b border-white/10 pb-8">
                <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter blur-target" data-i18n="sec-vertical">Vertical</h2>
                <span class="text-gray-600 font-bold uppercase tracking-widest text-[10px] italic">02</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-10 max-w-3xl w-full">
                <div data-aos="fade-up" class="video-card aspect-[9/16] group" onclick="openVideo('YOUTUBE_ID_3', 'vertical')">
                    <img src="./vert1.png" alt="Project">
                    <div class="play-icon"><i class="fa-solid fa-play text-white text-2xl"></i></div>
                </div>
                <div data-aos="fade-up" data-aos-delay="200" class="video-card aspect-[9/16] group" onclick="openVideo('YOUTUBE_ID_4', 'vertical')">
                    <img src="./vert2.png" alt="Project">
                    <div class="play-icon"><i class="fa-solid fa-play text-white text-2xl"></i></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="contact" class="py-24 px-6 text-center border-t border-white/5">
        <h2 class="text-[12vw] md:text-[120px] font-black uppercase mb-12 tracking-tighter italic text-outline leading-none blur-target" data-i18n="footer-title">Let's work</h2>
        <div class="flex flex-col items-center">
            <div class="email-pill" id="copy-email" onclick="copyEmail()">
                <i class="fa-solid fa-envelope" id="mail-icon"></i>
                <span id="email-text">secretg836@gmail.com</span>
            </div>
            <div class="flex justify-center items-center gap-8 md:gap-12" data-aos="zoom-in">
                <a href="https://t.me/secretyshka" target="_blank" class="social-link text-4xl md:text-5xl"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://x.com/secretyshka" target="_blank" class="social-link text-4xl md:text-5xl"><i class="fa-brands fa-square-x-twitter"></i></a>
            </div>
        </div>
        <p class="mt-20 text-[10px] text-gray-700 uppercase tracking-[0.5em] font-black italic">© 2026 Secretyshka Prod.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1200, once: true });

        function openVideo(id, type) {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('video-player');
            const wrapper = document.getElementById('modal-wrapper');
            player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            if (type === 'vertical') wrapper.classList.add('vertical');
            else wrapper.classList.remove('vertical');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('video-player');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; player.src = ''; }, 400);
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideo(); });

        const email = "secretg836@gmail.com";
        function copyEmail() {
            navigator.clipboard.writeText(email);
            const text = document.getElementById('email-text');
            const icon = document.getElementById('mail-icon');
            const pill = document.getElementById('copy-email');
            text.innerText = (currentLang === 'ru') ? "Скопировано!" : "Copied!";
            icon.className = "fa-solid fa-check";
            pill.style.background = "rgba(59, 130, 246, 0.2)";
            setTimeout(() => { text.innerText = email; icon.className = "fa-solid fa-envelope"; pill.style.background = "rgba(255, 255, 255, 0.05)"; }, 2000);
        }

        const translations = {
            en: { "nav-vertical": "Vertical", "nav-horizontal": "Horizontal", "btn-contact-nav": "Contact", "hero-title-1": "Video editing", "hero-title-2": "For your brand", "hero-desc": "High-end vertical content and cinematic motion design.", "btn-work": "View Projects", "btn-contact-main": "Contact Me", "sec-vertical": "Vertical", "sec-horizontal": "Horizontal", "footer-title": "Let's work" },
            ru: { "nav-vertical": "Вертикальные", "nav-horizontal": "Горизонтальные", "btn-contact-nav": "Контакты", "hero-title-1": "Монтаж видео", "hero-title-2": "Для бренда", "hero-desc": "Создаю виральный вертикальный контент и профессиональный моушн-дизайн.", "btn-work": "Смотреть работы", "btn-contact-main": "Связаться", "sec-vertical": "Вертикальные", "sec-horizontal": "Горизонтальные", "footer-title": "Поработаем?" }
        };

        let currentLang = localStorage.getItem('prefLang') || 'en';

        function applyBlurEffect(el, text) {
            if (!text) return;
            const words = text.split(' ');
            el.innerHTML = '';
            words.forEach((word, i) => {
                const span = document.createElement('span');
                span.textContent = word + (i === words.length - 1 ? '' : ' ');
                span.className = 'blur-word';
                span.style.transitionDelay = `${(i * 80)}ms`;
                el.appendChild(span);
                setTimeout(() => span.classList.add('visible'), 50);
            });
        }

        function changeLang(lang, force = false) {
            const slider = document.getElementById('lang-slider');
            const btnEn = document.getElementById('txt-en');
            const btnRu = document.getElementById('txt-ru');
            const isMobile = window.innerWidth < 768;
            if (lang === currentLang && !force) return;
            currentLang = lang;
            localStorage.setItem('prefLang', lang);
            const moveDist = isMobile ? 36 : 42;
            slider.style.transform = (lang === 'en') ? 'translateX(0)' : `translateX(${moveDist}px)`;
            if (lang === 'en') { btnEn.classList.add('lang-active-text'); btnRu.classList.remove('lang-active-text'); }
            else { btnRu.classList.add('lang-active-text'); btnEn.classList.remove('lang-active-text'); }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const text = translations[lang][key];
                if (el.classList.contains('blur-target')) applyBlurEffect(el, text);
                else el.textContent = text;
            });
        }

        window.onscroll = function() {
            const nav = document.getElementById('navbar');
            const btt = document.getElementById('backToTop');
            if (window.pageYOffset > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
            if (window.pageYOffset > 400) btt.classList.add('show');
            else btt.classList.remove('show');
        };

        document.addEventListener('DOMContentLoaded', () => changeLang(currentLang, true));
    </script>
</body>
</html>
